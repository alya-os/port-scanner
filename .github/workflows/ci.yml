name: Cross-platform checks

on:
  push:
  pull_request:

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Tauri dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Select stable Rust
        run: rustup default stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test process grouping
        run: npm run test:web

      - name: Build the interface
        run: npm run build

      - name: Test the native engine
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Smoke-test the native scanner
        run: cargo run --manifest-path src-tauri/Cargo.toml --example scan_summary

      - name: Compile the desktop application
        run: npm run tauri build -- --no-bundle
