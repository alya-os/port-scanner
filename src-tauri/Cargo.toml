[package]
name = "connexions-locales"
version = "0.1.0"
description = "Inspect and safely manage local listening ports and their processes."
authors = ["Jean-Philippe Lefebvre"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "connexions_locales_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
netstat2 = "0.11.2"
sysinfo = "0.36.1"
